name: Engine checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Report every platform even when one fails; a cancelled job hides its result.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The tray host (Tauri 2, ADR-0011) is a default workspace member, so every
      # gate builds it; on Linux that needs WebKitGTK and AppIndicator headers.
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=2
      # Failure classification must not depend on the user's language. Git for
      # Windows on the dev machines ships no translations, so prove it here on a
      # Git that really prints German; the guard keeps the check from passing
      # trivially if translations ever go missing.
      - name: Locale independence with a translating Git
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo locale-gen de_DE.UTF-8
          german=$(LANG=de_DE.UTF-8 LC_ALL=de_DE.UTF-8 LANGUAGE=de git -C "$(mktemp -d)" status 2>&1 || true)
          echo "Git under de_DE.UTF-8: $german"
          if ! grep -q "Kein Git-Repository" <<<"$german"; then
            echo "::error::Git does not print German messages here, so the locale test would prove nothing"
            exit 1
          fi
          cargo test --test cli failure_classification_does_not_depend_on_the_user_locale
