[workspace]
# The tray host is a separate GUI executable sharing the engine library (ADR-0012).
# Both are default members, so the standard gates build and test both.
members = [".", "tray"]
default-members = [".", "tray"]

[workspace.package]
# One version for the CLI and the tray host; `/release` bumps it here.
version = "0.2.5"
edition = "2024"

[package]
name = "dispatch-mesh"
version.workspace = true
edition.workspace = true
description = "Git-backed synchronization with editing sessions and recorded intent"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dunce = "1"
fs2 = "0.4"
ignore = "0.4"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
